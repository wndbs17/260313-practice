<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: #172b4d;
        font-family: "Noto Sans KR", sans-serif;
        background: transparent;
      }
      .board {
        overflow: hidden;
        padding: 12px;
        border: 1px solid #e6edf4;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 5px 18px #152b4510;
      }
      .title {
        margin: 0 0 8px;
        font-size: 15px;
        font-weight: 700;
      }
      svg {
        display: block;
        width: 100%;
        height: auto;
        max-height: 440px;
        touch-action: none;
        user-select: none;
      }
      .grid { stroke: #dbe5ed; stroke-width: 1.2; }
      .axis { stroke: #bdcbd8; stroke-width: 1.5; }
      .quiz-axis { stroke: #ff8066; stroke-width: 3; }
      .axis-label { fill: #e66c52; font-size: 13px; font-weight: 700; }
      .shape {
        fill: #bfece5;
        fill-opacity: .78;
        stroke: #087f8c;
        stroke-width: 3;
        stroke-linejoin: round;
      }
      #radius-line {
        stroke: #087f8c;
        stroke-width: 2.5;
        stroke-dasharray: 7 5;
        pointer-events: none;
      }
      .vertex {
        fill: #087f8c;
        stroke: #fff;
        stroke-width: 3;
        cursor: grab;
        touch-action: none;
      }
      .vertex:hover, .vertex.dragging {
        fill: #f0785d;
        cursor: grabbing;
        r: 12px;
      }
      .label {
        fill: #172b4d;
        font-size: 13px;
        font-weight: 700;
        pointer-events: none;
      }
      .help {
        margin: 7px 2px 0;
        color: #718096;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="board">
      <p class="title" id="title">도형의 점을 끌어 보세요</p>
      <svg id="grid" viewBox="0 0 560 560" aria-label="도형의 점을 드래그하는 격자">
        <g id="grid-lines"></g>
        <polygon id="polygon" class="shape"></polygon>
        <circle id="circle-shape" class="shape"></circle>
        <line id="radius-line"></line>
        <g id="vertices"></g>
      </svg>
      <p class="help" id="help">점은 격자 칸에 맞춰 움직여요. 점을 잡아 끌어 보세요.</p>
    </div>
    <script>
      const svg = document.getElementById("grid");
      const polygon = document.getElementById("polygon");
      const circleShape = document.getElementById("circle-shape");
      const radiusLine = document.getElementById("radius-line");
      const verticesGroup = document.getElementById("vertices");
      const gridGroup = document.getElementById("grid-lines");
      const title = document.getElementById("title");
      const help = document.getElementById("help");
      const minPixel = 38;
      const maxPixel = 522;
      const minCoord = -6;
      const maxCoord = 6;
      const spacing = (maxPixel - minPixel) / (maxCoord - minCoord);
      let points = [];
      let activeIndex = null;
      let componentArgs = {};

      function toPixel(point) {
        return [
          minPixel + (point[0] - minCoord) * spacing,
          minPixel + (maxCoord - point[1]) * spacing,
        ];
      }

      function drawGrid() {
        const lines = [];
        for (let value = minCoord; value <= maxCoord; value += 1) {
          const x = minPixel + (value - minCoord) * spacing;
          const y = minPixel + (maxCoord - value) * spacing;
          const xClass = value === 0
            ? (componentArgs.axis === "vertical" ? "quiz-axis" : "axis")
            : "grid";
          const yClass = value === 0
            ? (componentArgs.axis === "horizontal" ? "quiz-axis" : "axis")
            : "grid";
          lines.push(`<line x1="${x}" y1="${minPixel}" x2="${x}" y2="${maxPixel}" class="${xClass}"/>`);
          lines.push(`<line x1="${minPixel}" y1="${y}" x2="${maxPixel}" y2="${y}" class="${yClass}"/>`);
        }
        if (componentArgs.axis === "vertical") {
          const x = minPixel + (0 - minCoord) * spacing;
          lines.push(`<text x="${x + 8}" y="29" class="axis-label">대칭축</text>`);
        } else if (componentArgs.axis === "horizontal") {
          const y = minPixel + (maxCoord - 0) * spacing;
          lines.push(`<text x="${maxPixel - 62}" y="${y - 8}" class="axis-label">대칭축</text>`);
        }
        gridGroup.innerHTML = lines.join("");
      }

      function render() {
        const isCircle = componentArgs.shape_name === "원";
        polygon.style.display = isCircle ? "none" : "";
        circleShape.style.display = isCircle ? "" : "none";
        radiusLine.style.display = isCircle ? "" : "none";
        if (isCircle) {
          const [center, edge] = points;
          const [cx, cy] = toPixel(center);
          const [ex, ey] = toPixel(edge);
          const radius = Math.hypot(ex - cx, ey - cy);
          circleShape.setAttribute("cx", cx);
          circleShape.setAttribute("cy", cy);
          circleShape.setAttribute("r", radius);
          radiusLine.setAttribute("x1", cx);
          radiusLine.setAttribute("y1", cy);
          radiusLine.setAttribute("x2", ex);
          radiusLine.setAttribute("y2", ey);
        } else {
          polygon.setAttribute("points", points.map((point) => toPixel(point).join(",")).join(" "));
        }
        verticesGroup.replaceChildren();
        points.forEach((point, index) => {
          const [x, y] = toPixel(point);
          const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          circle.setAttribute("cx", x);
          circle.setAttribute("cy", y);
          circle.setAttribute("r", "9");
          circle.setAttribute("class", `vertex${activeIndex === index ? " dragging" : ""}`);
          circle.dataset.index = index;
          const circleLabel = index === 0 ? "원의 중심" : "원의 반지름 끝점";
          circle.setAttribute(
            "aria-label",
            isCircle ? circleLabel : `꼭짓점 ${String.fromCharCode(65 + index)}`
          );
          const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
          label.setAttribute("x", x + 12);
          label.setAttribute("y", y - 10);
          label.setAttribute("class", "label");
          label.textContent = isCircle
            ? (index === 0 ? "중심" : "반지름")
            : String.fromCharCode(65 + index);
          verticesGroup.append(circle, label);
        });
      }

      function pointFromEvent(event) {
        const cursor = svg.createSVGPoint();
        cursor.x = event.clientX;
        cursor.y = event.clientY;
        const local = cursor.matrixTransform(svg.getScreenCTM().inverse());
        const x = Math.round(minCoord + (local.x - minPixel) / spacing);
        const y = Math.round(maxCoord - (local.y - minPixel) / spacing);
        return [
          Math.max(componentArgs.min_coord, Math.min(componentArgs.max_coord, x)),
          Math.max(componentArgs.min_coord, Math.min(componentArgs.max_coord, y)),
        ];
      }

      function sendValue() {
        window.parent.postMessage(
          { isStreamlitMessage: true, type: "streamlit:setComponentValue", value: points },
          "*"
        );
      }

      svg.addEventListener("pointerdown", (event) => {
        const vertex = event.target.closest("[data-index]");
        if (!vertex) return;
        activeIndex = Number(vertex.dataset.index);
        svg.setPointerCapture(event.pointerId);
        render();
        event.preventDefault();
      });

      svg.addEventListener("pointermove", (event) => {
        if (activeIndex === null) return;
        const nextPoint = pointFromEvent(event);
        if (componentArgs.shape_name === "원" && activeIndex === 0) {
          const dx = nextPoint[0] - points[0][0];
          const dy = nextPoint[1] - points[0][1];
          const minDx = Math.max(
            componentArgs.min_coord - points[0][0],
            componentArgs.min_coord - points[1][0]
          );
          const maxDx = Math.min(
            componentArgs.max_coord - points[0][0],
            componentArgs.max_coord - points[1][0]
          );
          const minDy = Math.max(
            componentArgs.min_coord - points[0][1],
            componentArgs.min_coord - points[1][1]
          );
          const maxDy = Math.min(
            componentArgs.max_coord - points[0][1],
            componentArgs.max_coord - points[1][1]
          );
          const shiftX = Math.max(minDx, Math.min(maxDx, dx));
          const shiftY = Math.max(minDy, Math.min(maxDy, dy));
          points = points.map((point) => [point[0] + shiftX, point[1] + shiftY]);
        } else if (
          componentArgs.shape_name !== "원" ||
          activeIndex !== 1 ||
          nextPoint[0] !== points[0][0] ||
          nextPoint[1] !== points[0][1]
        ) {
          points[activeIndex] = nextPoint;
        }
        render();
        event.preventDefault();
      });

      function finishDrag() {
        if (activeIndex === null) return;
        activeIndex = null;
        render();
        sendValue();
      }

      svg.addEventListener("pointerup", finishDrag);
      svg.addEventListener("pointercancel", finishDrag);

      window.addEventListener("message", (event) => {
        if (event.data.type !== "streamlit:render") return;
        componentArgs = event.data.args;
        points = componentArgs.points.map((point) => [Number(point[0]), Number(point[1])]);
        const isCircle = componentArgs.shape_name === "원";
        title.textContent = isCircle
          ? "원의 중심이나 둘레 위 점을 끌어 보세요"
          : `${componentArgs.shape_name} 꼭짓점을 끌어 보세요`;
        help.textContent = isCircle
          ? "중심은 원을 옮기고, 둘레 위 점은 반지름을 바꿔요."
          : "꼭짓점은 격자 칸에 맞춰 움직여요. 점을 잡아 끌어 보세요.";
        drawGrid();
        render();
      });

      window.parent.postMessage(
        { isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 },
        "*"
      );
      window.parent.postMessage(
        { isStreamlitMessage: true, type: "streamlit:setFrameHeight", height: 540 },
        "*"
      );
    </script>
  </body>
</html>
